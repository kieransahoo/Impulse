services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: impulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - impulse_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d impulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  impulse_pgvector_data:
